# Quality gates on every push and PR. Lint, format and typecheck run on the
# runner; all tests run in containers (compose.test.yaml), never on the runner.
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json `packageManager`
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @restaurant/shared build
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: cp .env.example .env
      - run: pnpm test
      - run: pnpm test:int
      - run: docker compose build
      - name: Prod api image contains the compiled entry points
        run: docker compose run --rm --no-deps --entrypoint sh api -c 'test -f dist/main.js && test -f dist/seed/seed.js'
