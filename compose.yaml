name: restaurant

# One api image serves `api`, `migrate` and `seed`.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: prod
  image: restaurant-api:local
  init: true
  env_file: .env
  environment:
    PORT: "3000"

services:
  postgres:
    image: postgres:18.6-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *api
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    <<: *api
    command: ["node", "dist/seed/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api
    depends_on:
      seed:
        condition: service_completed_successfully
    # Shell can't import TS: keep this URL in sync with API_PREFIX in
    # packages/shared/src/api-routes.ts.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    image: restaurant-web:local
    init: true
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2.11.7-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
