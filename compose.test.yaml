# Test override: every test runs in a container, never on the host.
#   unit:        pnpm test      (api-unit, web-unit; no infrastructure)
#   integration: pnpm test:int  (api-test against postgres-test/redis-test)
# Runners reuse the dev images (deps only) with the source bind-mounted and
# fresh anonymous node_modules volumes from the image, removed by `run --rm`.
# Test databases publish no ports and keep their data in tmpfs.

x-api-runner: &api-runner
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: dev
  image: restaurant-api:dev
  init: true
  volumes:
    - .:/repo
    - /repo/node_modules
    - /repo/apps/api/node_modules
    - /repo/packages/shared/node_modules

services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "test", "-d", "test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api-unit:
    <<: *api-runner
    command:
      - sh
      - -c
      - pnpm --filter @restaurant/shared build && pnpm --filter "api..." test

  web-unit:
    init: true
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: restaurant-web:dev
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
    command:
      - sh
      - -c
      - pnpm --filter @restaurant/shared build && pnpm --filter web test

  api-test:
    <<: *api-runner
    environment:
      TEST_DATABASE_URL: postgresql://test:test@postgres-test:5432/test
      TEST_REDIS_URL: redis://redis-test:6379
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        pnpm --filter @restaurant/shared build &&
        pnpm --filter api exec prisma generate &&
        pnpm --filter api test:int
