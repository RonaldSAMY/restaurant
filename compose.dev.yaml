# Dev override: docker compose -f compose.yaml -f compose.dev.yaml up
# The app runs only in containers (dev and prod), never on the host.
# Source is bind-mounted; node_modules live in named volumes (never from the host).
# Editor: run `pnpm install` once on the host for types only. Generated files
# (packages/shared/dist, apps/api/src/generated, apps/web/next-env.d.ts) reach the
# host through the bind mount once this stack has started.
# After a dependency change, the *-modules volumes still hold the old node_modules
# (`up --build` doesn't refresh them). Remove only those, not postgres-data:
#   docker compose -f compose.yaml -f compose.dev.yaml down
#   docker volume ls -q | grep -- '-modules$' | xargs docker volume rm

services:
  shared:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    image: restaurant-api:dev
    init: true
    command: ["pnpm", "--filter", "@restaurant/shared", "dev"]
    volumes:
      - .:/repo
      - api-root-modules:/repo/node_modules
      - api-shared-modules:/repo/packages/shared/node_modules
    healthcheck:
      # Loads dist and checks a current export, so a stale dist from an older checkout fails.
      test: ["CMD", "node", "-e", "require('/repo/packages/shared/dist').API_PREFIX || process.exit(1)"]
      interval: 2s
      retries: 60

  api:
    build:
      target: dev
    image: restaurant-api:dev
    volumes:
      - .:/repo
      - api-root-modules:/repo/node_modules
      - api-app-modules:/repo/apps/api/node_modules
      - api-shared-modules:/repo/packages/shared/node_modules
    depends_on:
      shared:
        condition: service_healthy
    healthcheck:
      start_period: 60s

  web:
    build:
      target: dev
    image: restaurant-web:dev
    volumes:
      - .:/repo
      - web-root-modules:/repo/node_modules
      - web-app-modules:/repo/apps/web/node_modules
      - web-shared-modules:/repo/packages/shared/node_modules
    depends_on:
      shared:
        condition: service_healthy

volumes:
  api-root-modules:
  api-app-modules:
  api-shared-modules:
  web-root-modules:
  web-app-modules:
  web-shared-modules:
